<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Factory - Monitoramento</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 15px #0000000a;
            text-align: center;
        }

        .card h2 {
            font-size: 17px;
            color: #64748b;
        }

        .valor {
            font-size: 40px;
            font-weight: bold;
            margin: 20px 0;
        }

        .status {
            text-align: center;
            margin-top: 25px;
            padding: 24px;
            background: white;
            border-radius: 14px;
        }

        .normal {
            color: #15803d;
            font-weight: bold;
        }

        .alerta {
            color: #dc2626;
            font-weight: bold;
        }

        .aguardando {
            color: #64748b;
            font-weight: bold;
        }

        button {
            display: block;
            margin: 30px auto;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header>
            <h1>Smart Factory</h1>
            <p class="subtitle">
                Monitoramento de temperatura e umidade
            </p>
        </header>

        {% if dados %}

        <section class="cards">
            <div class="card">
                <h2>Temperatura</h2>
                <div class="valor">
                    {{ "%.1f"|format(dados.temperatura) }} °C
                </div>
            </div>

            <div class="card">
                <h2>Umidade</h2>
                <div class="valor">
                    {{ "%.1f"|format(dados.umidade) }} %
                </div>
            </div>
        </section>

        <section class="status">
            <h2>Estado da Fábrica</h2>

            <p class="{{ 'alerta' if dados.estado == 'ALERTA' else 'normal' }}">
                {{ dados.estado }}
            </p>
        </section>

        {% else %}

        <section class="status">
            <h2>Estado da Fábrica</h2>
            <p class="aguardando">Aguardando dados</p>
        </section>

        {% endif %}

        <form action="/" method="GET">
            <button type="submit">Atualizar</button>
        </form>

    </main>
</body>
</html>
